services:
  mock-market:
    build: .
    container_name: marketus-mock-market
    ports:
      - "8080:8080"
    environment:
      MOCK_SEED: "42"
      MOCK_SCENARIO: "default"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
