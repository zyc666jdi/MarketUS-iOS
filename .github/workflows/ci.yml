name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 生产环境请把 Action 与 brew 版本 pin 到具体版本/SHA（见 docs/infrastructure.md）
      - run: brew install swiftlint swiftformat
      - run: make lint

  dispatcher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run dispatcher unittest suite
        run: make test-dispatcher

  package-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests (Core + Data)
        run: make test-package

  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen swiftlint
      - run: make bootstrap
      # Hosted macOS runners may not have an iPhone simulator device installed;
      # build for the generic simulator, and keep UI tests local/nightly.
      - run: make build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/
            coverage-report.txt
          retention-days: 7
