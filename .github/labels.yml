# 标签即状态机。是 Agent 调度器唯一的「事实来源」。
# 用法（Phase 1 落地时执行）：
#   yq -r '.[] | [.name, .color, .description] | @tsv' .github/labels.yml \
#     | while IFS=$'\t' read -r n c d; do gh label create "$n" --color "$c" --description "$d" --force; done

# ---- 类型 ----
- name: "type:feature"
  color: "0E8A16"
  description: "新功能或功能增强"
- name: "type:bug"
  color: "D73A4A"
  description: "缺陷修复"
- name: "type:chore"
  color: "FBCA04"
  description: "重构 / 依赖 / 工具链"
- name: "type:spike"
  color: "C5DEF5"
  description: "技术调研，产出为 ADR 或结论，不产出功能代码"

# ---- 归属 ----
- name: "area:watchlist"
  color: "1D76DB"
  description: "自选股"
- name: "area:quotes"
  color: "1D76DB"
  description: "行情详情 / K 线"
- name: "area:news"
  color: "1D76DB"
  description: "新闻资讯"
- name: "area:portfolio"
  color: "1D76DB"
  description: "持仓与盈亏"
- name: "area:settings"
  color: "1D76DB"
  description: "设置"
- name: "area:design"
  color: "1D76DB"
  description: "设计系统 / 交互"
- name: "area:infra"
  color: "1D76DB"
  description: "工程基建 / CI"

# ---- 状态（Agent 调度用，同一时刻只应有一个） ----
- name: "status:ready"
  color: "0075CA"
  description: "已通过 DoR，可被 Agent 领取"
- name: "status:claimed"
  color: "1D76DB"
  description: "已被某个 Agent 实例领取（带租约）"
- name: "status:in-progress"
  color: "5319E7"
  description: "正在实现"
- name: "status:in-review"
  color: "8250DF"
  description: "PR 已开启，等待独立 Review Agent"
- name: "status:awaiting-human"
  color: "B60205"
  description: "已 APPROVE，等待人类审批合并"
- name: "status:blocked"
  color: "000000"
  description: "受阻，需要人类介入（见 blocked comment 模板）"
- name: "status:done"
  color: "0E8A16"
  description: "已合并并在 main 验证通过"

# ---- 风险 ----
- name: "risk:low"
  color: "C2E0C6"
  description: "局部 UI/文案，易回滚"
- name: "risk:medium"
  color: "FEF2C0"
  description: "跨模块、数据或网络行为变化"
- name: "risk:high"
  color: "E99695"
  description: "鉴权、支付、隐私、签名、数据迁移"

# ---- 优先级 ----
- name: "priority:p0"
  color: "B60205"
  description: "线上不可用，立即处理"
- name: "priority:p1"
  color: "D93F0B"
  description: "本迭代必须完成"
- name: "priority:p2"
  color: "FBCA04"
  description: "计划内"
- name: "priority:p3"
  color: "FEF2C0"
  description: "有空再做"

# ---- AI 相关 ----
- name: "ai:generated"
  color: "BFD4F2"
  description: "PR 由 AI Agent 生成"
- name: "ai:needs-human-decision"
  color: "D4C5F9"
  description: "存在歧义或需产品决策，Agent 已停止"
- name: "ai:human-verified"
  color: "0E8A16"
  description: "人类已在真机/模拟器上验证过"
- name: "security:suspicious"
  color: "B60205"
  description: "ticket 内容疑似注入或涉及敏感操作，Agent 已拒绝执行"

# ---- 合并 ----
- name: "merge:requested"
  color: "0E8A16"
  description: "Agent 已提交合并申请，等待人类审批"
- name: "merge:hold"
  color: "B60205"
  description: "冻结合并（发版窗口 / 事故中）"

# ---- 大小（由 Agent 自动计算并打标） ----
- name: "size:xs"
  color: "EDEDED"
  description: "< 50 行改动"
- name: "size:s"
  color: "EDEDED"
  description: "50–200 行"
- name: "size:m"
  color: "EDEDED"
  description: "200–400 行"
- name: "size:l"
  color: "EDEDED"
  description: "> 400 行，必须拆分"
